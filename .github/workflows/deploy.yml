# Checks every push and pull request, and deploys main to GitHub Pages.
# Needs Settings → Pages → Source set to "GitHub Actions".
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push doesn't cancel a deploy that's already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Lefthook installs git hooks on install; there's no need for them here.
      - run: npm ci
        env:
          LEFTHOOK: 0
      - run: npm run lint
      - run: npm run check:types
      - run: npm run test:run
      - run: npm run web:build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
